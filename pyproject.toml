[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "decisionbench"
version = "0.1.0"
description = "Reproducible decision-model quality, load and cost harness"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "prometheus-client>=0.21,<1"]
classic = ["scikit-learn>=1.6,<2", "joblib>=1.4,<2"]
bert = ["torch>=2.6,<3", "transformers>=4.51,<5", "datasets>=3,<5", "accelerate>=1,<2"]
analysis = ["pandas>=2.2,<3", "pyarrow>=19,<24"]
experiments = ["matplotlib>=3.9,<4"]
tokenizer = ["transformers>=4.51,<5"]

[project.scripts]
decisionbench = "decisionbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["decisionbench", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
