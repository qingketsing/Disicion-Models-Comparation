name: massive-jev-local-v3
dataset_dir: data/normalized/massive-ai-v1
models:
  jev:
    adapter:
      kind: jev
      base_url: https://api.typesafe.ai
      model: jev-1.13.0
      api_key_env: TYPESAFE_API_KEY
    warmup: 5
    environment:
      network_path: Windows local Controller -> Clash HTTP proxy 127.0.0.1:7897 ->
        Typesafe API; no SSH tunnel
      api_quota_rps: 80
      api_quota_tokens_per_second: 100000
      quota_source: https://docs.typesafe.ai/models (2026-10-14); published dynamic
        limit, not guaranteed account quota
    cost:
      billing: api
      currency: USD
      input_price_per_million: 0.042
      output_price_per_million: 0
      price_source: https://docs.typesafe.ai/models; user confirmed standard pricing
      price_date: '2026-10-14'
common:
  timeout_s: 30
  slo_ms: 500
  max_concurrency: 32
  min_success_rate: 0.99
  max_scheduler_lag_ms: 20
cooldown_s: 30
blocks:
  checkpoint:
    enabled: true
    dataset: checkpoint-300.jsonl
    repeats: 1
  main:
    enabled: true
    dataset: test.jsonl
    repeats: 3
  load:
    enabled: true
    dataset: test.jsonl
    rates:
    - 1
    - 2
    - 4
    - 8
    duration_s: 120
    repeats: 3
  scale:
    enabled: true
    dataset: test.jsonl
    sizes:
    - 10
    - 30
    - 60
    seeds:
    - 42
    - 43
    - 44
    samples_per_anchor_class: 20
  descriptions:
    enabled: false
    dataset: test.jsonl
    repeats: 1
    mappings:
      brief: data/descriptions/brief.json
      detailed: data/descriptions/detailed.json
      boundary: data/descriptions/boundary.json
